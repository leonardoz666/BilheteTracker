<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Real Comando</title>
    <!-- Preconnect para Google Fonts - melhora performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- DNS prefetch para API backend -->
    <link rel="dns-prefetch" href="https://backtrack-api.onrender.com" />
    <!-- Preconnect para API (warm up conexão TCP/TLS) -->
    <link rel="preconnect" href="https://backtrack-api.onrender.com" crossorigin />
    <!-- Carregar fonte com font-display: swap para não bloquear renderização -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function () {
        const suppressedPrefixes = ['[Telegram.WebView]'];
        if (!window.console) {
          return;
        }

        const originalLog = window.console.log?.bind(window.console);

        if (!originalLog) {
          return;
        }

        window.console.log = function (...args) {
          const firstArg = args[0];
          const shouldSuppress =
            typeof firstArg === 'string' &&
            suppressedPrefixes.some((prefix) => firstArg.startsWith(prefix));

          if (!shouldSuppress) {
            originalLog(...args);
          }
        };
      })();
    </script>
    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
